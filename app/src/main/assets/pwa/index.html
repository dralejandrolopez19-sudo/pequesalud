<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1E5AA8" />
  <meta name="description" content="PequeSalud — Seguimiento pediátrico familiar, curvas OMS, carnet de vacunas PAI y consultorio clínico." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="PequeSalud" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="./icons/icon-192.svg" />
  <link rel="apple-touch-icon" href="./icons/icon-192.svg" />
  <title>PequeSalud</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="app-shell">
    <!-- Cabecera limpia y minimalista -->
    <header class="app-header">
      <div class="brand-row">
        <img src="./icons/icon-192.svg" alt="PequeSalud" class="brand-logo" />
        <div>
          <span id="workspaceBadge" class="workspace-tag parent">ESCRITORIO DE PADRES</span>
          <h1 class="brand-title" id="workspaceTitle">PequeSalud</h1>
          <p class="brand-subtitle" id="workspaceSubtitle">Salud infantil, vacunas y crecimiento</p>
        </div>
      </div>
      <div class="header-actions">
        <button id="installPwaBtn" class="btn btn-safe hidden" title="Instalar aplicación">
          📲 Instalar
        </button>
        <button id="openAddChildModalBtn" class="btn btn-outline">
          ➕ Hijo/a
        </button>
        <button id="authActionBtn" class="btn btn-outline" title="Sincronizar con tu cuenta">
          ☁️ Sincronizar
        </button>
        <button id="toggleDarkBtn" class="btn btn-icon" title="Alternar tema claro/oscuro" aria-label="Alternar tema">
          🌙
        </button>
        <button id="switchWorkspaceBtn" class="btn btn-soft-blue">
          🩺 Modo Pediatra
        </button>
      </div>
    </header>

    <!-- Selector horizontal de Hijos / Pacientes -->
    <section class="child-strip-card" aria-label="Paciente activo">
      <div id="childChipsContainer" class="child-chips-row"></div>
      <div id="activeChildSummaryBar" class="active-child-banner"></div>
    </section>

    <!-- Contenedor principal -->
    <div id="mainViewContainer"></div>
  </main>

  <!-- Barra de navegación inferior -->
  <nav id="bottomNavBar" class="bottom-nav" aria-label="Navegación principal"></nav>

  <!-- Modal PIN Modo Pediatra -->
  <div id="pinModalBackdrop" class="modal-backdrop hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <h2 class="card-title" style="margin-bottom: 6px;">🔒 Modo Pediatra</h2>
      <p class="card-subtitle" style="margin-bottom: 14px;">
        Ingresa tu PIN médico para acceder al consultorio clínico (PIN por defecto: <strong>1234</strong>).
      </p>
      <div class="input-group" style="margin-bottom: 14px;">
        <label for="pinInputField">PIN de seguridad</label>
        <input id="pinInputField" type="password" inputmode="numeric" maxlength="6" class="input-control" placeholder="1234" />
      </div>
      <p id="pinErrorMsg" style="color: var(--alert-red); font-size: 0.8rem; font-weight: 700; margin-bottom: 10px;" class="hidden">
        PIN incorrecto.
      </p>
      <div style="display: flex; justify-content: flex-end; gap: 8px;">
        <button id="fillDefaultPinBtn" class="btn btn-soft-blue" type="button">Usar 1234</button>
        <button id="cancelPinModalBtn" class="btn btn-outline" type="button">Cancelar</button>
        <button id="confirmPinModalBtn" class="btn btn-primary-pediatrician" type="button">Entrar</button>
      </div>
    </div>
  </div>

  <!-- Modal Registrar Hijo -->
  <div id="childModalBackdrop" class="modal-backdrop hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <h2 class="card-title" style="margin-bottom: 6px;">👶 Nuevo Perfil Pediátrico</h2>
      <p class="card-subtitle" style="margin-bottom: 14px;">
        Completa los datos básicos del niño o niña.
      </p>
      <div class="form-row">
        <div class="input-group">
          <label for="childNameInput">Nombre completo</label>
          <input id="childNameInput" type="text" class="input-control" placeholder="Ej. Sofía López" />
        </div>
        <div class="input-group">
          <label for="childAgeInput">Edad (años)</label>
          <input id="childAgeInput" type="number" min="0" max="19" step="1" class="input-control" value="2" />
        </div>
      </div>
      <div class="form-row">
        <div class="input-group">
          <label for="childGenderInput">Sexo biológico</label>
          <select id="childGenderInput" class="input-control">
            <option value="Femenino">Femenino</option>
            <option value="Masculino">Masculino</option>
          </select>
        </div>
        <div class="input-group">
          <label for="childBloodInput">Grupo sanguíneo</label>
          <select id="childBloodInput" class="input-control">
            <option value="O+">O+</option>
            <option value="O-">O-</option>
            <option value="A+">A+</option>
            <option value="A-">A-</option>
            <option value="B+">B+</option>
            <option value="AB+">AB+</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="input-group">
          <label for="childWeightInput">Peso actual (kg)</label>
          <input id="childWeightInput" type="number" step="0.1" class="input-control" value="12.4" />
        </div>
        <div class="input-group">
          <label for="childHeightInput">Talla actual (cm)</label>
          <input id="childHeightInput" type="number" step="0.5" class="input-control" value="87.5" />
        </div>
      </div>
      <div class="input-group" style="margin-bottom: 14px;">
        <label for="childAllergiesInput">Alergias</label>
        <input id="childAllergiesInput" type="text" class="input-control" placeholder="Ninguna" value="Ninguna" />
      </div>
      <div style="display: flex; justify-content: flex-end; gap: 8px;">
        <button id="cancelChildModalBtn" class="btn btn-outline" type="button">Cancelar</button>
        <button id="saveChildModalBtn" class="btn btn-safe" type="button">Guardar</button>
      </div>
    </div>
  </div>

  <div id="toastEl" class="toast-msg hidden"></div>

  <script src="./app.js" defer></script>
</body>
</html>
